<title>구름 요격대</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Chakra+Petch:wght@500;700&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* 레이아웃: 세로 9:13.5 캔버스 하나를 화면 중앙에 맞추고, HUD와 오버레이는 그 위에 겹친다. 단일 야간 해상 테마. */
:root {
  --deep: #061d26;
  --sea: #0c3b49;
  --ink: #e8f0ec;
  --mute: #8db0ac;
  --flare: #ff9a3c;
  --hostile: #ff4f8b;
  --heal: #5fe0a8;
  --display: 'Black Han Sans', 'Noto Sans KR', system-ui, sans-serif;
  --body: 'Noto Sans KR', system-ui, sans-serif;
  --num: 'Chakra Petch', ui-monospace, 'Consolas', monospace;
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body {
  height: 100%;
  background: var(--deep);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
#shell { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
#stage { position: relative; width: 480px; height: 720px; }
canvas {
  display: block; width: 100%; height: 100%;
  border-radius: 8px;
  box-shadow: 0 0 0 1px rgba(232, 240, 236, .08), 0 20px 60px rgba(0, 0, 0, .5);
  cursor: crosshair;
}
.hud { position: absolute; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px; pointer-events: none; }
.hud.top { top: 0; align-items: flex-start; }
.hud.bottom { bottom: 0; align-items: flex-end; }
.readout { display: flex; flex-direction: column; gap: 2px; }
.readout.right { align-items: flex-end; }
.label { font-size: 10px; letter-spacing: .14em; color: var(--mute); text-transform: uppercase; font-family: var(--num); }
.value { font-family: var(--num); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1; text-shadow: 0 2px 6px rgba(0,0,0,.5); }
.value.small { font-size: 15px; }
#boss { position: absolute; top: 58px; left: 50%; transform: translateX(-50%); width: 62%; display: flex; flex-direction: column; gap: 4px; align-items: center; pointer-events: none; }
#boss .bar { width: 100%; height: 6px; background: rgba(6, 29, 38, .7); border: 1px solid rgba(255, 79, 139, .5); border-radius: 3px; overflow: hidden; }
#boss .fill { height: 100%; width: 100%; background: var(--hostile); transform-origin: left; }
#boss .label { color: var(--hostile); }
.pips { display: flex; gap: 4px; }
.pip { width: 14px; height: 8px; border-radius: 2px; background: rgba(232,240,236,.15); }
.pip.on { background: var(--heal); box-shadow: 0 0 6px rgba(95,224,168,.6); }
.ctl { display: flex; gap: 8px; pointer-events: auto; }
button {
  font-family: var(--body); font-weight: 700; color: var(--ink);
  background: rgba(6, 29, 38, .72); border: 1px solid rgba(232, 240, 236, .25);
  border-radius: 6px; padding: 8px 12px; font-size: 14px; cursor: pointer;
}
button:hover { border-color: var(--flare); }
button:focus-visible { outline: 2px solid var(--flare); outline-offset: 2px; }
#bombBtn b { font-family: var(--num); color: var(--flare); margin-left: 4px; }
.overlay {
  position: absolute; inset: 0; border-radius: 8px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  padding: 24px; text-align: center;
  background: linear-gradient(180deg, rgba(6,29,38,.35), rgba(6,29,38,.82) 55%);
}
.overlay h1, .overlay h2 { margin: 0; font-family: var(--display); font-weight: 400; letter-spacing: .02em; text-wrap: balance; line-height: 1.05; }
.overlay h1 { font-size: clamp(40px, 11vw, 64px); color: var(--ink); text-shadow: 0 4px 0 rgba(255,154,60,.55); }
.overlay h2 { font-size: 40px; }
.overlay p { margin: 0; color: var(--mute); max-width: 30ch; line-height: 1.6; }
.callsign { font-family: var(--num); font-size: 11px; letter-spacing: .3em; color: var(--flare); }
.keys { display: grid; grid-template-columns: auto auto; gap: 6px 14px; font-size: 13px; text-align: left; color: var(--ink); }
.keys span:nth-child(odd) { font-family: var(--num); color: var(--flare); text-align: right; }
.cta { background: var(--flare); color: #1b0f05; border: none; font-size: 18px; padding: 12px 34px; border-radius: 6px; }
.cta:hover { filter: brightness(1.08); }
.result { display: flex; gap: 28px; }
.result .value { font-size: 30px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="shell">
  <div id="stage">
    <canvas id="game" aria-label="구름 요격대 게임 화면"></canvas>

    <div class="hud top">
      <div class="readout"><span class="label">Score</span><span class="value" id="score">0</span></div>
      <div class="readout right"><span class="label">구역 · 최고</span><span class="value small"><span id="stageNo">1</span> · <span id="best">0</span></span></div>
    </div>
    <div id="boss" hidden><span class="label">적 기함</span><div class="bar"><div class="fill" id="bossFill"></div></div></div>
    <div class="hud bottom">
      <div class="readout"><span class="label">기체 내구도 · 화력 <span id="pow">1</span></span><div class="pips" id="pips"></div></div>
      <div class="ctl">
        <button id="pauseBtn" type="button" aria-label="일시정지">II</button>
        <button id="bombBtn" type="button">폭탄<b id="bombs">2</b></button>
      </div>
    </div>

    <div class="overlay" id="titleScreen">
      <span class="callsign">SQUADRON 07 · NIGHT SORTIE</span>
      <h1>구름 요격대</h1>
      <p>바다 위 구름층을 뚫고 내려오는 적 편대를 요격하세요. 45초마다 적 기함이 나타납니다.</p>
      <div class="keys">
        <span>← ↑ → ↓ / WASD</span><span>이동 (터치·마우스는 드래그)</span>
        <span>자동</span><span>기관포 사격</span>
        <span>X · 버튼</span><span>폭탄 · 적탄 전부 소거</span>
        <span>P · Esc</span><span>일시정지</span>
      </div>
      <button class="cta" id="startBtn" type="button">출격</button>
    </div>

    <div class="overlay" id="pauseScreen" hidden>
      <h2>일시정지</h2>
      <button class="cta" id="resumeBtn" type="button">계속</button>
    </div>

    <div class="overlay" id="overScreen" hidden>
      <span class="callsign">MISSION REPORT</span>
      <h2>격추됨</h2>
      <div class="result">
        <div class="readout"><span class="label">점수</span><span class="value" id="finalScore">0</span></div>
        <div class="readout"><span class="label">도달 구역</span><span class="value" id="finalStage">1</span></div>
        <div class="readout"><span class="label">격추</span><span class="value" id="finalKills">0</span></div>
      </div>
      <p id="bestNote"></p>
      <button class="cta" id="againBtn" type="button">다시 출격</button>
    </div>
  </div>
</div>

<script>
(() => {
const W = 480, H = 720;
const $ = id => document.getElementById(id);
const cvs = $('game'), ctx = cvs.getContext('2d');
const shell = $('shell'), stageEl = $('stage');
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2;

/* ---------- 화면 맞춤 ---------- */
function fit() {
  const r = shell.getBoundingClientRect();
  const s = Math.max(0.3, Math.min(r.width / W, r.height / H));
  stageEl.style.width = W * s + 'px';
  stageEl.style.height = H * s + 'px';
  const d = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width = Math.round(W * s * d);
  cvs.height = Math.round(H * s * d);
  ctx.setTransform(cvs.width / W, 0, 0, cvs.height / H, 0, 0);
}
addEventListener('resize', fit);
fit();

/* ---------- 저장 ---------- */
let best = 0;
try { best = Number(localStorage.getItem('cloud-interceptor-best')) || 0; } catch (e) {}
function saveBest() { try { localStorage.setItem('cloud-interceptor-best', String(best)); } catch (e) {} }

/* ---------- 사운드 ---------- */
let ac = null, noiseBuf = null, muted = false;
function initAudio() {
  if (ac) return;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { ac = null; }
}
function sfx(kind) {
  if (!ac || muted) return;
  const t = ac.currentTime;
  const out = ac.createGain(); out.connect(ac.destination);
  if (kind === 'boom' || kind === 'big') {
    const big = kind === 'big';
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(big ? 900 : 1600, t);
    f.frequency.exponentialRampToValueAtTime(80, t + (big ? 1.2 : .4));
    out.gain.setValueAtTime(big ? .5 : .22, t);
    out.gain.exponentialRampToValueAtTime(.001, t + (big ? 1.3 : .45));
    src.connect(f); f.connect(out); src.start(t); src.stop(t + 1.4);
    return;
  }
  const o = ac.createOscillator(); o.connect(out);
  const spec = {
    hit:  ['square',   300, 140, .05, .04],
    item: ['sine',     520, 1240, .18, .18],
    hurt: ['sawtooth', 220, 50, .35, .2],
    bomb: ['triangle', 90, 30, .8, .35],
    warn: ['square',   440, 440, .5, .08],
  }[kind];
  if (!spec) return;
  o.type = spec[0];
  o.frequency.setValueAtTime(spec[1], t);
  o.frequency.exponentialRampToValueAtTime(spec[2], t + spec[3]);
  out.gain.setValueAtTime(spec[4], t);
  out.gain.exponentialRampToValueAtTime(.001, t + spec[3]);
  o.start(t); o.stop(t + spec[3] + .02);
}

/* ---------- 배경 (바다·섬·구름) ---------- */
const glints = Array.from({ length: 70 }, () => ({ x: rand(0, W), y: rand(0, H), w: rand(6, 22), a: rand(.05, .2) }));
function makeIsland(y) {
  const n = 7 + Math.floor(Math.random() * 5), r = rand(26, 60), pts = [];
  for (let i = 0; i < n; i++) pts.push(r * rand(.65, 1.15));
  return { x: rand(40, W - 40), y, r, pts, rot: rand(0, TAU) };
}
const islands = [makeIsland(rand(0, H)), makeIsland(rand(-H, 0))];
function makeCloud(y) {
  const puffs = [], n = 5 + Math.floor(Math.random() * 6), spread = rand(40, 90);
  for (let i = 0; i < n; i++) puffs.push({ dx: rand(-spread, spread), dy: rand(-spread * .4, spread * .4), r: rand(22, 46) });
  return { x: rand(-20, W + 20), y, puffs, speed: rand(95, 130) };
}
const clouds = Array.from({ length: 5 }, (_, i) => makeCloud(i * (H / 4) - 100));

function updateBg(dt) {
  for (const s of glints) { s.y += 45 * dt; if (s.y > H + 4) { s.y = -4; s.x = rand(0, W); } }
  for (let i = 0; i < islands.length; i++) { islands[i].y += 45 * dt; if (islands[i].y - 80 > H) islands[i] = makeIsland(rand(-500, -120)); }
  for (let i = 0; i < clouds.length; i++) { const c = clouds[i]; c.y += c.speed * dt; if (c.y - 140 > H) clouds[i] = makeCloud(rand(-260, -150)); }
}
function islandPath(is, scale) {
  ctx.beginPath();
  const n = is.pts.length;
  for (let i = 0; i <= n; i++) {
    const a = is.rot + i / n * TAU, r = is.pts[i % n] * scale;
    const x = is.x + Math.cos(a) * r, y = is.y + Math.sin(a) * r;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}
function drawBg() {
  const gr = ctx.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#0f4655'); gr.addColorStop(1, '#072833');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  for (const is of islands) {
    ctx.fillStyle = 'rgba(120, 200, 190, .16)'; islandPath(is, 1.35); ctx.fill();
    ctx.fillStyle = '#c9b98a'; islandPath(is, 1.06); ctx.fill();
    ctx.fillStyle = '#2f6b47'; islandPath(is, .9); ctx.fill();
    ctx.fillStyle = '#25583a'; islandPath(is, .5); ctx.fill();
  }
  ctx.strokeStyle = '#cfeee6'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  for (const s of glints) { ctx.globalAlpha = s.a; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + s.w, s.y); ctx.stroke(); }
  ctx.globalAlpha = 1;
  // 구름 그림자
  ctx.fillStyle = 'rgba(2, 18, 24, .22)';
  for (const c of clouds) for (const p of c.puffs) { ctx.beginPath(); ctx.arc(c.x + p.dx + 40, c.y + p.dy + 60, p.r, 0, TAU); ctx.fill(); }
}
function drawClouds() {
  for (const c of clouds) {
    ctx.fillStyle = 'rgba(214, 230, 228, .42)';
    for (const p of c.puffs) { ctx.beginPath(); ctx.arc(c.x + p.dx, c.y + p.dy, p.r, 0, TAU); ctx.fill(); }
    ctx.fillStyle = 'rgba(255, 255, 255, .25)';
    for (const p of c.puffs) { ctx.beginPath(); ctx.arc(c.x + p.dx - p.r * .2, c.y + p.dy - p.r * .25, p.r * .6, 0, TAU); ctx.fill(); }
  }
}

/* ---------- 게임 상태 ---------- */
let state = 'title', g = null;
const ENEMY = {
  dart:    { hp: 1,  r: 14, score: 100, vy: 230 },
  weaver:  { hp: 3,  r: 16, score: 150, vy: 115 },
  gunship: { hp: 16, r: 30, score: 600, vy: 90 },
};
function newGame() {
  g = {
    t: 0, score: 0, stage: 1, stageT: 0, kills: 0,
    spawnT: 1.2, bossPending: 0, boss: null,
    bullets: [], eb: [], enemies: [], items: [], parts: [],
    shake: 0, flash: 0, banner: { text: '1구역 진입', t: 2.2 },
    p: { x: W / 2, y: H - 120, hp: 5, max: 5, power: 1, inv: 2, cd: 0, bombs: 2, bank: 0, px: W / 2 },
  };
}

function addEnemy(type, x, y, phase = 0) {
  const b = ENEMY[type], mul = 1 + (g.stage - 1) * .35;
  const hp = Math.ceil(b.hp * mul);
  g.enemies.push({ type, x, y, x0: x, vy: b.vy * (1 + (g.stage - 1) * .07), hp, max: hp, r: b.r, score: b.score, t: 0, phase, fire: rand(.8, 2), hit: 0 });
}
function addBoss() {
  const hp = Math.round(170 * (1 + (g.stage - 1) * .55));
  const b = { type: 'boss', x: W / 2, y: -90, x0: W / 2, vy: 70, hp, max: hp, r: 56, score: 5000 * g.stage, t: 0, fire: 1, hit: 0, pat: 0, patT: 0, ang: 0 };
  g.enemies.push(b); g.boss = b;
}
function spawnWave() {
  const r = Math.random(), st = g.stage;
  if (r < .42) {
    const n = 3 + Math.floor(Math.random() * (2 + Math.min(st, 3)));
    const x0 = rand(60, W - 60), side = Math.random() < .5 ? -1 : 1;
    for (let i = 0; i < n; i++) addEnemy('dart', clamp(x0 + side * i * 36, 28, W - 28), -30 - i * 42);
  } else if (r < .8) {
    const n = 4 + Math.min(st, 3), x0 = rand(110, W - 110);
    for (let i = 0; i < n; i++) addEnemy('weaver', x0, -30 - i * 52, i * .55);
  } else {
    addEnemy('gunship', rand(90, W - 90), -60);
    if (st >= 3 && Math.random() < .5) addEnemy('gunship', rand(90, W - 90), -170);
  }
}

function shoot(x, y, ang, spd, r = 5) { g.eb.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r }); }
function aim(e) { return Math.atan2(g.p.y - e.y, g.p.x - e.x); }

/* ---------- 입력 ---------- */
const keys = new Set();
const drag = { on: false, id: null, lx: 0, ly: 0, dx: 0, dy: 0 };
addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  keys.add(e.code);
  if (e.repeat) return;
  if ((e.code === 'Enter' || e.code === 'Space') && (state === 'title' || state === 'over')) start();
  else if ((e.code === 'KeyP' || e.code === 'Escape') && (state === 'play' || state === 'pause')) togglePause();
  else if (e.code === 'KeyX' && state === 'play') bomb();
  else if (e.code === 'KeyM') muted = !muted;
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => { keys.clear(); if (state === 'play') togglePause(); });
function toLogical(e) { const r = cvs.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
cvs.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  drag.on = true; drag.id = e.pointerId; [drag.lx, drag.ly] = toLogical(e);
  try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
});
cvs.addEventListener('pointermove', e => {
  if (!drag.on || e.pointerId !== drag.id) return;
  const [x, y] = toLogical(e);
  drag.dx += (x - drag.lx) * 1.15; drag.dy += (y - drag.ly) * 1.15;
  drag.lx = x; drag.ly = y;
});
const endDrag = e => { if (e.pointerId === drag.id) drag.on = false; };
cvs.addEventListener('pointerup', endDrag);
cvs.addEventListener('pointercancel', endDrag);

/* ---------- 흐름 ---------- */
function start() {
  initAudio();
  if (ac && ac.state === 'suspended') ac.resume();
  newGame();
  state = 'play';
  $('titleScreen').hidden = true; $('overScreen').hidden = true; $('pauseScreen').hidden = true;
}
function togglePause() {
  state = state === 'play' ? 'pause' : 'play';
  $('pauseScreen').hidden = state !== 'pause';
  drag.on = false;
}
function gameOver() {
  state = 'over';
  const isBest = g.score > best;
  if (isBest) { best = g.score; saveBest(); }
  $('finalScore').textContent = g.score.toLocaleString();
  $('finalStage').textContent = g.stage;
  $('finalKills').textContent = g.kills;
  $('bestNote').textContent = isBest ? '새 최고 기록입니다.' : '최고 기록 ' + best.toLocaleString() + '점';
  setTimeout(() => { if (state === 'over') $('overScreen').hidden = false; }, 900);
}
$('startBtn').onclick = start;
$('againBtn').onclick = start;
$('resumeBtn').onclick = togglePause;
$('pauseBtn').onclick = () => { if (state === 'play' || state === 'pause') togglePause(); };
$('bombBtn').onclick = () => { if (state === 'play') bomb(); };

/* ---------- 전투 ---------- */
function fire(p) {
  const B = (dx, ang, dmg = 1) => g.bullets.push({ x: p.x + dx, y: p.y - 20, vx: Math.sin(ang) * 760, vy: -Math.cos(ang) * 760, dmg });
  B(-6, 0); B(6, 0);
  if (p.power >= 2) { B(-12, -.12); B(12, .12); }
  if (p.power >= 3) { B(-16, -.26); B(16, .26); }
  if (p.power >= 4) B(0, 0, 2);
  if (p.power >= 5) { B(-20, -.4); B(20, .4); }
}
function bomb() {
  const p = g.p;
  if (p.bombs <= 0) return;
  p.bombs--;
  for (const b of g.eb) { spark(b.x, b.y, '#ff9ec0', 2); g.score += 10; }
  g.eb.length = 0;
  for (const e of g.enemies) damage(e, e.type === 'boss' ? 25 : 14);
  p.inv = Math.max(p.inv, 1.2);
  g.flash = 1; g.shake = 18;
  g.parts.push({ kind: 'ring', x: p.x, y: p.y, life: .7, max: .7, size: 520, color: '#ffd59a' });
  sfx('bomb'); sfx('big');
}
function damage(e, d) {
  if (e.dead) return;
  e.hp -= d; e.hit = .07;
  if (e.hp <= 0) kill(e); else sfx('hit');
}
function kill(e) {
  e.dead = true;
  g.score += e.score; g.kills++;
  const big = e.type === 'boss';
  explode(e.x, e.y, big ? 4 : e.type === 'gunship' ? 2 : 1);
  sfx(big ? 'big' : 'boom');
  if (big) {
    g.boss = null; g.eb.length = 0;
    for (let i = 0; i < 5; i++) setTimeout(() => g && explode(e.x + rand(-60, 60), e.y + rand(-30, 30), 2), i * 160);
    ['P', 'P', 'H', 'B'].forEach((k, i) => g.items.push({ kind: k, x: e.x + (i - 1.5) * 34, y: e.y, t: 0 }));
    g.shake = 24;
    g.stage++; g.stageT = 0; g.spawnT = 3;
    g.banner = { text: g.stage + '구역 진입', t: 2.4 };
    return;
  }
  const chance = { dart: .05, weaver: .12, gunship: .65 }[e.type];
  if (Math.random() < chance) {
    const r = Math.random();
    g.items.push({ kind: r < .5 ? 'P' : r < .8 ? 'H' : 'B', x: e.x, y: e.y, t: 0 });
  }
}
function hurt() {
  const p = g.p;
  if (p.inv > 0 || state !== 'play') return;
  p.hp--; p.inv = 1.8; p.power = Math.max(1, p.power - 1);
  g.shake = 14; g.flash = .5;
  explode(p.x, p.y, .6);
  sfx('hurt');
  if (p.hp <= 0) { explode(p.x, p.y, 3); sfx('big'); p.dead = true; gameOver(); }
}

/* ---------- 파티클 ---------- */
const FIRE = ['#fff3c4', '#ffd36b', '#ff9a3c', '#ff5a2e'];
function spark(x, y, color, n = 4) {
  for (let i = 0; i < n; i++) { const a = rand(0, TAU), s = rand(60, 220); g.parts.push({ kind: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.15, .35), max: .35, size: rand(1.5, 3), color }); }
}
function explode(x, y, s) {
  g.parts.push({ kind: 'ring', x, y, life: .45, max: .45, size: 40 * s + 20, color: '#ffe2b0' });
  for (let i = 0; i < 16 * s; i++) { const a = rand(0, TAU), sp = rand(40, 260) * Math.sqrt(s); g.parts.push({ kind: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(.3, .8), max: .8, size: rand(2, 4.5), color: FIRE[Math.floor(Math.random() * FIRE.length)] }); }
  for (let i = 0; i < 6 * s; i++) { const a = rand(0, TAU), sp = rand(10, 70); g.parts.push({ kind: 'smoke', x: x + rand(-8, 8) * s, y: y + rand(-8, 8) * s, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp + 40, life: rand(.6, 1.2), max: 1.2, size: rand(8, 16) * Math.sqrt(s), color: '#2a3438' }); }
}

/* ---------- 갱신 ---------- */
function update(dt) {
  g.t += dt; g.stageT += dt;
  const p = g.p;

  if (!p.dead) {
    let dx = 0, dy = 0;
    if (keys.has('ArrowLeft') || keys.has('KeyA')) dx--;
    if (keys.has('ArrowRight') || keys.has('KeyD')) dx++;
    if (keys.has('ArrowUp') || keys.has('KeyW')) dy--;
    if (keys.has('ArrowDown') || keys.has('KeyS')) dy++;
    const len = Math.hypot(dx, dy) || 1;
    const before = p.x;
    p.x = clamp(p.x + dx / len * 330 * dt + drag.dx, 24, W - 24);
    p.y = clamp(p.y + dy / len * 330 * dt + drag.dy, 70, H - 40);
    drag.dx = drag.dy = 0;
    const vx = (p.x - before) / dt;
    p.bank += (clamp(vx / 380, -1, 1) - p.bank) * Math.min(1, dt * 10);
    p.inv = Math.max(0, p.inv - dt);
    p.cd -= dt;
    if (p.cd <= 0) { fire(p); p.cd = p.power >= 4 ? .09 : .11; }
  }

  // 스폰
  if (!g.boss && !g.bossPending) {
    if (g.stageT > 45) { g.bossPending = 3; g.banner = { text: '경고 · 적 기함 접근', t: 3, warn: true }; sfx('warn'); }
    else {
      g.spawnT -= dt;
      if (g.spawnT <= 0) { spawnWave(); g.spawnT = Math.max(.75, 2.3 - g.stage * .2 - g.stageT * .012); }
    }
  }
  if (g.bossPending) {
    g.bossPending -= dt;
    if (g.bossPending <= 0) { g.bossPending = 0; addBoss(); }
  }

  // 아군 탄
  for (const b of g.bullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
  g.bullets = g.bullets.filter(b => b.y > -20 && b.x > -20 && b.x < W + 20 && !b.dead);

  // 적
  for (const e of g.enemies) {
    e.t += dt; e.hit = Math.max(0, e.hit - dt); e.fire -= dt;
    if (e.type === 'dart') {
      e.y += e.vy * dt;
      if (g.stage >= 2 && e.fire <= 0 && e.y > 60 && e.y < H * .5) { shoot(e.x, e.y + 10, aim(e), 230, 4); e.fire = 99; }
    } else if (e.type === 'weaver') {
      e.y += e.vy * dt;
      e.x = e.x0 + Math.sin(e.t * 2.4 + e.phase) * 80;
      if (e.fire <= 0 && e.y > 40 && e.y < H * .65) { shoot(e.x, e.y + 12, aim(e), 210); e.fire = rand(1.6, 2.8) / (1 + (g.stage - 1) * .2); }
    } else if (e.type === 'gunship') {
      if (e.t < 7) e.y = Math.min(e.y + e.vy * dt, 130 + e.x0 % 60);
      else e.y += 70 * dt;
      e.x = e.x0 + Math.sin(e.t * .8) * 30;
      if (e.fire <= 0 && e.t < 7 && e.y > 60) {
        const base = aim(e), n = 5 + Math.min(g.stage, 4);
        for (let i = 0; i < n; i++) shoot(e.x, e.y + 20, base + (i - (n - 1) / 2) * .17, 190);
        e.fire = 1.5;
      }
    } else if (e.type === 'boss') {
      updateBoss(e, dt);
    }
  }

  // 충돌: 아군 탄 → 적
  for (const b of g.bullets) {
    for (const e of g.enemies) {
      if (e.dead || e.y < -20) continue;
      const rr = e.r + 4;
      if ((b.x - e.x) ** 2 + (b.y - e.y) ** 2 < rr * rr) {
        b.dead = true; spark(b.x, b.y, '#fff1b8', 2); damage(e, b.dmg); break;
      }
    }
  }
  g.bullets = g.bullets.filter(b => !b.dead);

  // 적 몸체 → 플레이어
  if (!p.dead) for (const e of g.enemies) {
    if (e.dead) continue;
    const rr = e.r * .8 + 10;
    if ((p.x - e.x) ** 2 + (p.y - e.y) ** 2 < rr * rr) { if (p.inv <= 0 && e.type !== 'boss') damage(e, 6); hurt(); }
  }
  g.enemies = g.enemies.filter(e => !e.dead && e.y < H + 80);

  // 적탄
  for (const b of g.eb) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (!p.dead) { const rr = b.r + 4; if ((p.x - b.x) ** 2 + (p.y - b.y) ** 2 < rr * rr) { b.dead = true; hurt(); } }
  }
  g.eb = g.eb.filter(b => !b.dead && b.x > -20 && b.x < W + 20 && b.y > -40 && b.y < H + 20);

  // 아이템
  for (const it of g.items) {
    it.t += dt;
    const d = Math.hypot(p.x - it.x, p.y - it.y);
    if (!p.dead && d < 90) { it.x += (p.x - it.x) / d * 260 * dt; it.y += (p.y - it.y) / d * 260 * dt; }
    else { it.y += 75 * dt; it.x += Math.sin(it.t * 3) * 30 * dt; }
    if (!p.dead && d < 24) {
      it.dead = true; sfx('item');
      if (it.kind === 'P') { if (p.power < 5) p.power++; else g.score += 1000; }
      else if (it.kind === 'H') { if (p.hp < p.max) p.hp++; else g.score += 500; }
      else if (it.kind === 'B') { p.bombs = Math.min(5, p.bombs + 1); }
      g.parts.push({ kind: 'ring', x: it.x, y: it.y, life: .3, max: .3, size: 40, color: '#e8f0ec' });
    }
  }
  g.items = g.items.filter(it => !it.dead && it.y < H + 30);

  updateParts(dt);
  g.shake = Math.max(0, g.shake - dt * 40);
  g.flash = Math.max(0, g.flash - dt * 2);
  if (g.banner) { g.banner.t -= dt; if (g.banner.t <= 0) g.banner = null; }
}

function updateBoss(e, dt) {
  if (e.y < 140) { e.y += e.vy * dt; return; }
  const rage = e.hp < e.max / 2 ? 1.5 : 1;
  e.x = W / 2 + Math.sin(e.t * .55) * 140;
  e.patT += dt;
  if (e.patT > 5) { e.patT = 0; e.pat = (e.pat + 1) % 3; e.fire = .6; }
  if (e.fire > 0) return;
  if (e.pat === 0) { // 부채꼴
    const n = 11 + g.stage;
    for (let i = 0; i < n; i++) shoot(e.x, e.y + 30, Math.PI / 2 + (i - (n - 1) / 2) * .14 + Math.sin(e.t) * .1, 170 * rage);
    e.fire = .85 / rage;
  } else if (e.pat === 1) { // 나선
    e.ang += .38;
    for (let k = 0; k < 3; k++) shoot(e.x, e.y + 10, e.ang + k * TAU / 3, 150 * rage, 4);
    e.fire = .09 / rage;
  } else { // 조준 연사
    const a = aim(e);
    for (const off of [-.08, 0, .08]) { shoot(e.x - 36, e.y + 20, a + off, 260 * rage, 4); shoot(e.x + 36, e.y + 20, a + off, 260 * rage, 4); }
    e.fire = .45 / rage;
  }
}

function updateParts(dt) {
  for (const q of g.parts) {
    q.life -= dt;
    if (q.kind !== 'ring') { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= .94; q.vy *= .94; }
  }
  g.parts = g.parts.filter(q => q.life > 0);
}

/* ---------- 그리기: 기체 ---------- */
function poly(pts) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); ctx.fill(); }
function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill(); }

function playerShape(main, trim, glass) {
  ctx.fillStyle = main;
  poly([0, -8, 32, 6, 32, 12, 0, 9, -32, 12, -32, 6]);       // 주익
  poly([0, 14, 13, 24, 13, 28, -13, 28, -13, 24]);            // 꼬리날개
  ell(0, 2, 6.5, 26);                                         // 동체
  if (!trim) return;
  ctx.fillStyle = trim;
  poly([26, 7, 32, 6, 32, 12, 26, 11.5]); poly([-26, 7, -32, 6, -32, 12, -26, 11.5]);
  ctx.fillRect(-1.5, 16, 3, 10);
  ctx.fillStyle = glass; ell(0, -9, 3.2, 7);
}
function drawPlayer(p) {
  if (p.dead) return;
  ctx.save();
  ctx.translate(p.x + 22, p.y + 34); ctx.scale(.75 * (1 - Math.abs(p.bank) * .22), .75);
  playerShape('rgba(0,10,14,.28)'); ctx.restore();

  ctx.save(); ctx.translate(p.x, p.y);
  if (p.inv > 0 && Math.floor(g.t * 18) % 2) ctx.globalAlpha = .35;
  // 배기 불꽃
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(255,154,60,.75)'; ell(0, 32, 3.5, 7 + Math.random() * 5);
  ctx.globalCompositeOperation = 'source-over';
  ctx.scale(1 - Math.abs(p.bank) * .22, 1);
  playerShape('#dfe9e5', '#ff9a3c', '#174f5f');
  // 기울어짐 음영
  ctx.fillStyle = 'rgba(6,29,38,.25)';
  if (p.bank > .1) poly([0, -8, 32, 6, 32, 12, 0, 9]); else if (p.bank < -.1) poly([0, -8, -32, 6, -32, 12, 0, 9]);
  ctx.restore();
  if (p.inv > 0 && p.inv < 1.3) return;
}

function enemyShape(e, c) {
  const hot = e.hit > 0;
  const body = hot ? '#ffffff' : c[0], dark = hot ? '#ffffff' : c[1];
  ctx.fillStyle = body;
  if (e.type === 'dart') {
    poly([0, 18, 16, -10, 0, -3, -16, -10]);
    ctx.fillStyle = dark; poly([0, 18, 4, 0, 0, -3, -4, 0]);
  } else if (e.type === 'weaver') {
    poly([0, 6, 24, -6, 22, -1, 0, 12, -22, -1, -24, -6]);
    poly([0, -16, 9, -20, 9, -17, -9, -17, -9, -20]);
    ell(0, 0, 5, 18);
    ctx.fillStyle = dark; ell(0, 8, 2.5, 5);
  } else if (e.type === 'gunship') {
    poly([-46, -4, 46, -4, 42, 8, -42, 8]);
    poly([-16, -26, 16, -26, 14, -20, -14, -20]);
    ell(0, -2, 9, 32);
    ctx.fillStyle = dark;
    ell(-22, 2, 5, 13); ell(22, 2, 5, 13);
    ctx.fillRect(-40, 0, 6, 3); ctx.fillRect(34, 0, 6, 3);
    ell(0, 18, 4, 6);
  } else if (e.type === 'boss') {
    poly([0, 50, 96, -6, 90, 6, 40, 18, 0, 36, -40, 18, -90, 6, -96, -6]);
    poly([0, -40, 46, -16, 96, -6, 0, 10, -96, -6, -46, -16]);
    ctx.fillStyle = dark;
    poly([0, 30, 26, 4, 0, -28, -26, 4]);
    for (const x of [-36, 36]) { ell(x, 18, 7, 7); }
    for (const x of [-64, -50, 50, 64]) ctx.fillRect(x - 3, -10, 6, 14);
    ctx.fillStyle = hot ? '#fff' : '#ff4f8b';
    ell(0, 4, 6, 6);
  }
}
const ECOL = { dart: ['#c63b52', '#5e1625'], weaver: ['#a0497a', '#3e1430'], gunship: ['#6c5a84', '#2b2240'], boss: ['#4b3c63', '#21182f'] };
function drawEnemies() {
  for (const e of g.enemies) {   // 그림자
    const s = e.type === 'boss' ? .7 : .65;
    ctx.save(); ctx.translate(e.x + 26, e.y + 40); ctx.scale(s, s);
    enemyShape({ type: e.type, hit: 0 }, ['rgba(0,10,14,.25)', 'rgba(0,10,14,0)']);
    ctx.restore();
  }
  for (const e of g.enemies) {
    ctx.save(); ctx.translate(e.x, e.y);
    if (e.type === 'weaver') ctx.rotate(Math.cos(e.t * 2.4 + e.phase) * .35);
    enemyShape(e, ECOL[e.type]);
    ctx.restore();
    if (e.type === 'gunship' && e.hp < e.max) {
      ctx.fillStyle = 'rgba(6,29,38,.7)'; ctx.fillRect(e.x - 24, e.y - 42, 48, 4);
      ctx.fillStyle = '#ff4f8b'; ctx.fillRect(e.x - 24, e.y - 42, 48 * e.hp / e.max, 4);
    }
  }
}

function drawBullets() {
  ctx.globalCompositeOperation = 'lighter';
  for (const b of g.bullets) {
    ctx.fillStyle = b.dmg > 1 ? 'rgba(255,170,90,.9)' : 'rgba(255,241,184,.9)';
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vx, -b.vy));
    ell(0, 0, b.dmg > 1 ? 3 : 2, b.dmg > 1 ? 11 : 9);
    ctx.restore();
  }
  ctx.globalCompositeOperation = 'source-over';
  for (const b of g.eb) {
    ctx.fillStyle = 'rgba(255,79,139,.35)'; ell(b.x, b.y, b.r + 3, b.r + 3);
    ctx.fillStyle = '#ff4f8b'; ell(b.x, b.y, b.r, b.r);
    ctx.fillStyle = '#ffe3ee'; ell(b.x, b.y, b.r * .45, b.r * .45);
  }
}

const ITEM = { P: ['#ff9a3c', 'P'], H: ['#5fe0a8', '+'], B: ['#ff4f8b', 'B'] };
function drawItems() {
  for (const it of g.items) {
    const [c, ch] = ITEM[it.kind];
    ctx.save(); ctx.translate(it.x, it.y);
    ctx.strokeStyle = c; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 13, it.t * 3, it.t * 3 + TAU * .75); ctx.stroke();
    ctx.fillStyle = 'rgba(6,29,38,.85)'; ell(0, 0, 10, 10);
    ctx.fillStyle = c; ctx.font = '700 13px "Chakra Petch", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(ch, 0, 1);
    ctx.restore();
  }
}

function drawParts() {
  for (const q of g.parts) if (q.kind === 'smoke') {
    ctx.globalAlpha = q.life / q.max * .55; ctx.fillStyle = q.color;
    ell(q.x, q.y, q.size * (1.6 - q.life / q.max), q.size * (1.6 - q.life / q.max));
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighter';
  for (const q of g.parts) {
    const k = q.life / q.max;
    if (q.kind === 'spark') { ctx.globalAlpha = k; ctx.fillStyle = q.color; ell(q.x, q.y, q.size, q.size); }
    else if (q.kind === 'ring') {
      ctx.globalAlpha = k * .8; ctx.strokeStyle = q.color; ctx.lineWidth = 3 * k + 1;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.size * (1 - k) + 4, 0, TAU); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawBanner() {
  const b = g.banner; if (!b) return;
  const a = Math.min(1, b.t * 2, (b.warn ? 3 : 2.4) - b.t + .2);
  if (b.warn && Math.floor(b.t * 4) % 2) return;
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.fillStyle = 'rgba(6,29,38,.6)'; ctx.fillRect(0, H * .38 - 30, W, 60);
  ctx.fillStyle = b.warn ? '#ff4f8b' : '#e8f0ec';
  ctx.font = '400 32px "Black Han Sans", "Noto Sans KR", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(b.text, W / 2, H * .38 + 2);
  ctx.globalAlpha = 1;
}

/* ---------- HUD ---------- */
const hud = { score: $('score'), stage: $('stageNo'), best: $('best'), pips: $('pips'), bombs: $('bombs'), pow: $('pow'), boss: $('boss'), bossFill: $('bossFill') };
let lastHud = '';
function drawHud() {
  const s = g ? g : { score: 0, stage: 1, p: { hp: 5, max: 5, bombs: 2, power: 1 }, boss: null };
  const key = [s.score, s.stage, s.p.hp, s.p.bombs, s.p.power, best, s.boss ? s.boss.hp : -1].join();
  if (key === lastHud) return; lastHud = key;
  hud.score.textContent = s.score.toLocaleString();
  hud.stage.textContent = s.stage;
  hud.best.textContent = Math.max(best, s.score).toLocaleString();
  hud.bombs.textContent = s.p.bombs;
  hud.pow.textContent = s.p.power;
  hud.pips.innerHTML = Array.from({ length: s.p.max }, (_, i) => `<span class="pip${i < s.p.hp ? ' on' : ''}"></span>`).join('');
  hud.boss.hidden = !s.boss;
  if (s.boss) hud.bossFill.style.transform = `scaleX(${Math.max(0, s.boss.hp / s.boss.max)})`;
}

/* ---------- 루프 ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  if (state !== 'pause') updateBg(dt);
  if (state === 'play' || (state === 'over' && g)) update(dt);

  ctx.save();
  if (g && g.shake > 0) ctx.translate(rand(-g.shake, g.shake) * .5, rand(-g.shake, g.shake) * .5);
  drawBg();
  drawClouds();
  if (g) { drawItems(); drawEnemies(); drawBullets(); drawPlayer(g.p); drawParts(); }
  if (g) drawBanner();
  ctx.restore();
  if (g && g.flash > 0) { ctx.fillStyle = `rgba(255,236,200,${g.flash * .55})`; ctx.fillRect(0, 0, W, H); }
  drawHud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
